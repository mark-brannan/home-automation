# Sitting timer: counts while the radar sees you within Desk distance; pauses while
# FAR (seen past it); FAR or away, the display flashes the time, then counts down
# a 5 min break, and clears the sitting at zero. "Today" rolls over on your return from a night's absence, not at
# midnight: away 1 h or more with some of it in 22:00-06:00, or 6 h with no clock.
# Needs presence, moving, distance from common/ld2410.yaml. Published to Home Assistant.
globals:
  - id: sit_s          # seconds at the desk, this sitting
    type: int
    initial_value: "0"
  - id: away_s         # seconds away since you left; counts up without a cap
    type: int
    initial_value: "0"
  - id: gone_s         # seconds not at the desk (FAR or away), this absence
    type: int
    initial_value: "0"
  - id: still_s        # seconds at the desk since the radar last saw you move
    type: int
    initial_value: "0"
  - id: up_s           # uptime; millis() wraps at 49.7 days
    type: uint32_t
    initial_value: "0"
  - id: join_s         # seconds since Wi-Fi was last connected
    type: int
    initial_value: "0"
  - id: today_s        # seconds at the desk today
    type: int
    initial_value: "0"
  - id: today_sits     # sittings started today
    type: int
    initial_value: "0"
  - id: today_longest  # longest sitting today, seconds
    type: int
    initial_value: "0"
  - id: today_breaks   # absences of 5 min or more today
    type: int
    initial_value: "0"
  - id: away_night     # this absence has touched 22:00-06:00
    type: bool
    initial_value: "false"

# Beyond this the radar still sees you, but you are FAR, not at the desk.
# Widen Max Move/Still Distance Gate past it, or FAR never shows.
number:
  - platform: template
    name: Desk distance
    id: desk_cm
    unit_of_measurement: cm
    min_value: 30
    max_value: 600
    step: 5
    initial_value: 120
    restore_value: true
    optimistic: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(up_s)++;
          id(join_s) = WiFi.status() == WL_CONNECTED ? 0 : id(join_s) + 1;
          const bool seen = id(presence).state;
          const bool at_desk = seen && id(distance).state <= id(desk_cm).state;
          if (at_desk) {
            const int a = id(away_s);
            if ((a >= 3600 && id(away_night)) || a >= 6 * 3600) {   // a new day
              id(today_s) = id(today_sits) = id(today_longest) = id(today_breaks) = 0;
            }
            id(away_s) = 0;
            id(gone_s) = 0;
            id(away_night) = false;
            if (id(sit_s) == 0) id(today_sits)++;
            id(sit_s)++;
            id(today_s)++;
            if (id(sit_s) > id(today_longest)) id(today_longest) = id(sit_s);
            id(still_s) = id(moving).state ? 0 : id(still_s) + 1;
          }
          if (!at_desk && ++id(gone_s) == 306 && id(sit_s) > 0) {   // 6 s flash + 5 min break
            id(sit_s) = 0;
            id(today_breaks)++;
          }
          if (!at_desk && !seen) {
            id(still_s) = 0;
            auto now = id(wall_clock).now();
            if (now.is_valid() && (now.hour >= 22 || now.hour < 6)) id(away_night) = true;
            id(away_s)++;
          }

time:
  - platform: sntp
    id: wall_clock

sensor:
  - platform: template
    name: Sitting seconds
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(sit_s);
  - platform: template
    name: Away seconds
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(away_s);
  - platform: template
    name: Still seconds
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(still_s);
  - platform: template
    name: Desk seconds today
    unit_of_measurement: s
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(today_s);
