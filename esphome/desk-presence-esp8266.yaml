# Desk chair presence: ESP8266 (Wemos D1 mini) + HLK-LD2410C mmWave radar.
# Bring-up and tuning: docs/desk-presence-bringup.md
substitutions:
  name: desk-presence
  friendly_name: Desk Presence

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  api: !include common/api.yaml
  ota: !include common/ota.yaml
  logger: !include common/logger.yaml
  web: !include common/web.yaml
  radar: !include common/ld2410.yaml
  sitting: !include common/sitting.yaml

# The ESP8266 has one full hardware UART, and 256000 baud is too fast for
# software serial. The radar takes UART0 on its swapped pins, so the logger
# moves to UART1 (TX only, GPIO2 / D4); logs still stream over the API.
logger:
  hardware_uart: UART1

# Power save sleeps through multicast, so desk-presence.local never answers.
wifi:
  power_save_mode: none

# LD2410C TX -> GPIO13 (D7, UART0 RX swapped); LD2410C RX -> GPIO15 (D8,
# UART0 TX swapped). GPIO15 must be low at boot; the D1 mini pulls it down.
uart:
  id: uart_bus
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# Free heap, to judge whether the web page is worth its RAM on this chip.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: Free Heap

# Sitting timer and its two displays (TM1637 and SSD1306 OLED).
# Pins: workshop projects/desk-presence-sensor/README.md, Wiring table.
i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1

# 8 rows of 21 characters, halmet's layout (symphony firmware/halmet).
font:
  - file: "gfonts://Silkscreen"
    id: small
    size: 8

display:
  - platform: tm1637
    clk_pin: GPIO14   # D5
    dio_pin: GPIO12   # D6
    intensity: 3
    update_interval: 1s
    lambda: |-
      it.printf("%02d.%02d", (id(sit_s) / 60) % 100, id(sit_s) % 60);
  # Rows: 0 network (4 s each when on the LAN, JOINING or AP FALLBACK off it),
  # 1 uptime and restart reason, 2 desk state (distance, then radar energies,
  # 2 s each), 3-4 today, 5 stillness and the next nag. 6-7 spare.
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"   # an SH1106 needs model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto f = id(small);
      const uint32_t up = id(up_s);
      if (WiFi.status() == WL_CONNECTED) {
        switch ((up / 4) % 4) {
          case 0: it.print(0, 0, f, App.get_name().c_str()); break;
          case 1: it.print(0, 0, f, WiFi.localIP().toString().c_str()); break;
          case 2: it.print(0, 0, f, WiFi.macAddress().c_str()); break;
          default: it.printf(0, 0, f, "%.14s / %ddB", WiFi.SSID().c_str(), (int) WiFi.RSSI());
        }
      } else if ((WiFi.getMode() & WIFI_AP) && (up / 4) % 2) {
        it.print(0, 0, f, "AP FALLBACK");
      } else {
        it.printf(0, 0, f, "JOINING %ds", id(join_s));
      }

      const char *why;
      switch (ESP.getResetInfoPtr()->reason) {
        case REASON_DEFAULT_RST: why = ""; break;   // power on
        case REASON_WDT_RST: why = "hw wdt"; break;
        case REASON_EXCEPTION_RST: why = "crash"; break;
        case REASON_SOFT_WDT_RST: why = "sw wdt"; break;
        case REASON_SOFT_RESTART: why = "restart"; break;
        case REASON_DEEP_SLEEP_AWAKE: why = "wake"; break;
        case REASON_EXT_SYS_RST: why = "ext pin"; break;
        default: why = "?";
      }
      it.printf(0, 8, f, "Up %ud %02u:%02u:%02u %s", up / 86400, up / 3600 % 24, up / 60 % 60, up % 60, why);

      const float cm = id(distance).state;
      if (!id(presence).state) {
        const int a = id(away_s);
        if (a < 3600) it.printf(0, 16, f, "AWAY %02d:%02d", a / 60, a % 60);
        else it.printf(0, 16, f, "AWAY %d:%02d:%02d", a / 3600, a / 60 % 60, a % 60);
      } else {
        const char *where = cm <= id(desk_cm).state ? "AT DESK" : "FAR";
        switch ((up / 2) % 3) {
          case 0: it.printf(0, 16, f, "%s %.2fm", where, cm / 100); break;
          case 1: it.printf(0, 16, f, "%s move e%.0f", where, id(move_e).state); break;
          default: it.printf(0, 16, f, "%s still e%.0f", where, id(still_e).state);
        }
      }

      it.printf(0, 24, f, "Today %dh%02d  %d sits", id(today_s) / 3600, id(today_s) / 60 % 60, id(today_sits));
      it.printf(0, 32, f, "Longest %dh%02d brk %d", id(today_longest) / 3600, id(today_longest) / 60 % 60, id(today_breaks));
      const int left = 3000 - id(sit_s);   // the 50 min nag
      if (left > 0) it.printf(0, 40, f, "Still %dm nag %02d:%02d", id(still_s) / 60, left / 60, left % 60);
      else it.printf(0, 40, f, "Still %dm nag +%dm", id(still_s) / 60, -left / 60);
