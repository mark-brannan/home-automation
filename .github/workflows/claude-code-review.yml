name: Claude PR Review

# An independent reviewer for every pull request: advisory. The reviewer is
# shared (mark-brannan/.github holds the workflow); this file is only the
# trigger. Until CLAUDE_CODE_OAUTH_TOKEN exists as a secret the review skips
# with a warning rather than failing the pull request.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# The called workflow asks for exactly these; a caller may grant no less.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_BOT_APP_ID: ${{ secrets.AGENT_BOT_APP_ID }}
      AGENT_BOT_PRIVATE_KEY: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
