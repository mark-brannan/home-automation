# Desk chair presence: ESP8266 (Wemos D1 mini) + HLK-LD2410C mmWave radar.
# Bring-up and tuning: docs/desk-presence-bringup.md
substitutions:
  name: desk-presence
  friendly_name: Desk Presence

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  api: !include common/api.yaml
  ota: !include common/ota.yaml
  logger: !include common/logger.yaml
  web: !include common/web.yaml
  radar: !include common/ld2410.yaml
  sitting: !include common/sitting.yaml

# The ESP8266 has one full hardware UART, and 256000 baud is too fast for
# software serial. The radar takes UART0 on its swapped pins, so the logger
# moves to UART1 (TX only, GPIO2 / D4); logs still stream over the API.
logger:
  hardware_uart: UART1

# Power save sleeps through multicast, so desk-presence.local never answers.
wifi:
  power_save_mode: none

# LD2410C TX -> GPIO13 (D7, UART0 RX swapped); LD2410C RX -> GPIO15 (D8,
# UART0 TX swapped). GPIO15 must be low at boot; the D1 mini pulls it down.
uart:
  id: uart_bus
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# Free heap, to judge whether the web page is worth its RAM on this chip.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: Free Heap

# Sitting timer and its two displays (TM1637 and SSD1306 OLED).
# Pins: workshop projects/desk-presence-sensor/README.md, Wiring table.
i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1

# A step up from halmet's 5x7: letters 9 px tall, four rows 16 px apart.
font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 12

display:
  # At the desk: the sitting time. FAR or away: it flashes frozen (halmet's burst, 6 x 150 ms
  # on/off, then 4 s steady), then counts the 5 min break down; at 0 the sitting is cleared.
  - platform: tm1637
    clk_pin: GPIO14   # D5
    dio_pin: GPIO12   # D6
    intensity: 3
    update_interval: 150ms
    lambda: |-
      static uint32_t since = 0;
      static bool gone = false;
      const bool at_desk = id(presence).state && id(distance).state <= id(desk_cm).state;
      int shown = id(sit_s);
      if (at_desk) {
        gone = false;
      } else {
        if (!gone) { gone = true; since = millis(); }
        const uint32_t t = millis() - since;
        if (t < 1800) {
          if (t % 300 >= 150) return;   // dark half of a flash
        } else if (t >= 5800) {
          shown = std::max(0, 306 - id(gone_s));
        }
      }
      it.printf("%02d.%02d", (shown / 60) % 100, shown % 60);
  # 0 sitting timer; 1 distance / micro macro (blank when away); 2 uptime;
  # 3 restart reason for 30 s after a reset, else the network, 4 s each:
  # joining: JOINING Ns (UNABLE TO JOIN after 2 min), host, MAC;
  # joined: host, IP, MAC, SSID / signal.
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"   # an SH1106 needs model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto f = id(roboto);
      const uint32_t up = id(up_s);
      const float cm = id(distance).state;
      const bool far = id(presence).state && cm > id(desk_cm).state;

      // 0: how long sitting; FAR holds it, AWAY counts up
      if (id(presence).state) {
        it.printf(0, 0, f, "%s %d:%02d", far ? "FAR" : "SITTING", id(sit_s) / 60, id(sit_s) % 60);
      } else {
        const int a = id(away_s);
        it.printf(0, 0, f, "AWAY %d:%02d", a / 60, a % 60);
      }

      // 1: distance
      // micro-motion (still energy) then macro-motion (move energy), 0-100
      if (id(presence).state)
        it.printf(0, 16, f, "Dist: %.0fcm / %.0f %.0f", cm, id(still_e).state, id(move_e).state);

      // 2: uptime
      it.printf(0, 32, f, "Uptime: %ud %02u:%02u:%02u", up / 86400, up / 3600 % 24, up / 60 % 60, up % 60);

      // 3: restart reason at boot, then the network (halmet's row 0 pattern)
      static uint32_t tick = 0;
      tick++;
      const bool online = WiFi.status() == WL_CONNECTED;
      const char *why = nullptr;
      switch (ESP.getResetInfoPtr()->reason) {
        case REASON_DEFAULT_RST: break;   // power on: nothing to say
        case REASON_WDT_RST: why = "hw watchdog"; break;
        case REASON_EXCEPTION_RST: why = "crash"; break;
        case REASON_SOFT_WDT_RST: why = "sw watchdog"; break;
        case REASON_SOFT_RESTART: why = "restart"; break;
        case REASON_DEEP_SLEEP_AWAKE: why = "wake"; break;
        case REASON_EXT_SYS_RST: why = "ext pin"; break;
        default: why = "unknown";
      }
      if (why && up < 30) {
        it.printf(0, 48, f, "Restart: %s", why);
      } else if (!online) {
        switch ((tick / 4) % 3) {
          case 0:
            if (id(join_s) >= 120) it.print(0, 48, f, "UNABLE TO JOIN");
            else it.printf(0, 48, f, "JOINING %ds", id(join_s));
            break;
          case 1: it.printf(0, 48, f, "Host: %s", App.get_name().c_str()); break;
          default: it.print(0, 48, f, WiFi.macAddress().c_str());
        }
      } else {
        switch ((tick / 4) % 4) {
          case 0: it.printf(0, 48, f, "Host: %s", App.get_name().c_str()); break;
          case 1: it.printf(0, 48, f, "IP: %s", WiFi.localIP().toString().c_str()); break;
          case 2: it.print(0, 48, f, WiFi.macAddress().c_str()); break;
          default: {
            String tail = " / " + String(WiFi.RSSI()) + "dB";
            String ssid = WiFi.SSID();
            ssid = ssid.substring(0, 21 - tail.length());  // 21 chars fit the 128 px row
            it.print(0, 48, f, (ssid + tail).c_str());
          }
        }
      }
