# Telemetry stack: OTLP in, VictoriaMetrics and VictoriaLogs behind it.
# Self-contained: copy this folder anywhere and `docker compose up -d`.
name: telemetry

services:
  collector:
    image: otel/opentelemetry-collector:0.165.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${TELEMETRY_BIND:-127.0.0.1}:4317:4317"   # OTLP gRPC
      - "${TELEMETRY_BIND:-127.0.0.1}:4318:4318"   # OTLP HTTP
    depends_on:
      - victoriametrics
      - victorialogs

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=12   # months
    volumes:
      - vm-data:/storage
    ports:
      - "127.0.0.1:8428:8428"

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
    volumes:
      - vl-data:/storage
    ports:
      - "127.0.0.1:9428:9428"

  # A second Grafana, apart from the boat stack's. Data sources and
  # dashboards come from files; nothing is configured in the UI.
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: >-
        victoriametrics-metrics-datasource@1.0.1,victoriametrics-logs-datasource@0.34.0,frser-sqlite-datasource@4.0.6
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Unset: the empty folders beside this file, so the stack still comes up.
      - ${CLAUDE_CHECKOUT:-.}/dashboards:/etc/grafana/dashboards/claude:ro
      - ${CLAUDE_METRICS_DB_DIR:-./sqlite}:/var/lib/claude-sqlite:ro
    ports:
      - "${TELEMETRY_BIND:-127.0.0.1}:3030:3000"
    depends_on:
      - victoriametrics
      - victorialogs

volumes:
  vm-data:
  vl-data:
  grafana-data:
