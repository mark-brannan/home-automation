name: Secret scan

# Has a credential reached git? Full-history gitleaks plus verified-live
# trufflehog, shared via mark-brannan/.github. Encrypted-file checks live in
# ci.yml (secrets-encrypted).

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    # Weekly re-scan: trufflehog ships new detectors continuously.
    - cron: "41 9 * * 1"

# Scheduled runs are exempt from cancellation; a push only needs its newest
# commit scanned.
concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  secret-scan:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/secret-scan.yml@main
