# Desk chair presence: ESP8266 (Wemos D1 mini) + HLK-LD2410C mmWave radar.
# Bring-up and tuning: docs/desk-presence-bringup.md
substitutions:
  name: desk-presence
  friendly_name: Desk Presence

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  api: !include common/api.yaml
  ota: !include common/ota.yaml
  logger: !include common/logger.yaml
  web: !include common/web.yaml
  radar: !include common/ld2410.yaml
  sitting: !include common/sitting.yaml

# The ESP8266 has one full hardware UART, and 256000 baud is too fast for
# software serial. The radar takes UART0 on its swapped pins, so the logger
# moves to UART1 (TX only, GPIO2 / D4); logs still stream over the API.
logger:
  hardware_uart: UART1

# Power save sleeps through multicast, so desk-presence.local never answers.
wifi:
  power_save_mode: none

# LD2410C TX -> GPIO13 (D7, UART0 RX swapped); LD2410C RX -> GPIO15 (D8,
# UART0 TX swapped). GPIO15 must be low at boot; the D1 mini pulls it down.
uart:
  id: uart_bus
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# Free heap, to judge whether the web page is worth its RAM on this chip.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: Free Heap

# Sitting timer and its two displays (TM1637 and SSD1306 OLED).
# Pins: workshop projects/desk-presence-sensor/README.md, Wiring table.
i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1

# 4 rows of about 10 characters; each row cycles every 4 s, as halmet's row 0 does.
font:
  - file: "gfonts://Silkscreen"
    id: small
    size: 16

display:
  - platform: tm1637
    clk_pin: GPIO14   # D5
    dio_pin: GPIO12   # D6
    intensity: 3
    update_interval: 1s
    lambda: |-
      it.printf("%02d.%02d", (id(sit_s) / 60) % 100, id(sit_s) % 60);
  # Rows, each cycling on its own 4 s beat: 0 desk state, 1 sitting stats,
  # 2 network (JOINING / AP FALLBACK off the LAN), 3 uptime and restart reason.
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"   # an SH1106 needs model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto f = id(small);
      const uint32_t up = id(up_s);
      const uint32_t beat = up / 4;
      auto hm = [](int s, char *b, const char *pre) {
        if (s < 3600) sprintf(b, "%s%02d:%02d", pre, s / 60, s % 60);
        else sprintf(b, "%s%dH%02d", pre, s / 3600, s / 60 % 60);
      };
      char b[24];

      // 0: where you are
      if (!id(presence).state) {
        hm(id(away_s), b, "AWAY ");
        it.print(0, 0, f, b);
      } else {
        const char *where = id(distance).state <= id(desk_cm).state ? "DESK" : "FAR";
        switch (beat % 3) {
          case 0: it.printf(0, 0, f, "%s %.2fM", where, id(distance).state / 100); break;
          case 1: it.printf(0, 0, f, "MOVE E%.0f", id(move_e).state); break;
          default: it.printf(0, 0, f, "STILL E%.0f", id(still_e).state);
        }
      }

      // 1: this sitting and today
      const int left = 3000 - id(sit_s);   // the 50 min nag
      switch (beat % 6) {
        case 0: it.printf(0, 16, f, "STILL %dM", id(still_s) / 60); break;
        case 1:
          if (left > 0) it.printf(0, 16, f, "NAG %02d:%02d", left / 60, left % 60);
          else it.printf(0, 16, f, "NAG +%dM", -left / 60);
          break;
        case 2: it.printf(0, 16, f, "TODAY %dH%02d", id(today_s) / 3600, id(today_s) / 60 % 60); break;
        case 3: it.printf(0, 16, f, "%d SITS", id(today_sits)); break;
        case 4: it.printf(0, 16, f, "LONG %dH%02d", id(today_longest) / 3600, id(today_longest) / 60 % 60); break;
        default: it.printf(0, 16, f, "%d BREAKS", id(today_breaks));
      }

      // 2: network
      if (WiFi.status() == WL_CONNECTED) {
        IPAddress ip = WiFi.localIP();
        switch (beat % 3) {
          case 0: it.printf(0, 32, f, "IP .%d.%d", ip[2], ip[3]); break;
          case 1: it.printf(0, 32, f, "WIFI %dDB", (int) WiFi.RSSI()); break;
          default: it.printf(0, 32, f, "%.9s", WiFi.SSID().c_str());
        }
      } else if ((WiFi.getMode() & WIFI_AP) && beat % 2) {
        it.print(0, 32, f, "AP FALLBK");
      } else {
        it.printf(0, 32, f, "JOINING %d", id(join_s));
      }

      // 3: uptime, then why it last restarted (skipped after a power-on)
      const char *why = nullptr;
      switch (ESP.getResetInfoPtr()->reason) {
        case REASON_DEFAULT_RST: break;
        case REASON_WDT_RST: why = "HW WDT"; break;
        case REASON_EXCEPTION_RST: why = "CRASH"; break;
        case REASON_SOFT_WDT_RST: why = "SW WDT"; break;
        case REASON_SOFT_RESTART: why = "RESTART"; break;
        case REASON_DEEP_SLEEP_AWAKE: why = "WAKE"; break;
        case REASON_EXT_SYS_RST: why = "EXT PIN"; break;
        default: why = "RESET ?";
      }
      if (why && beat % 2) it.print(0, 48, f, why);
      else if (up < 86400) it.printf(0, 48, f, "UP %uH%02u", up / 3600, up / 60 % 60);
      else it.printf(0, 48, f, "UP %uD %02uH", up / 86400, up / 3600 % 24);
