# HLK-LD2410C presence radar: every entity, board-independent. The device
# file supplies a uart with id uart_bus at 256000 baud.
ld2410:
  uart_id: uart_bus

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target

sensor:
  - platform: ld2410
    detection_distance:
      name: Detection Distance
    moving_distance:
      name: Moving Distance
    still_distance:
      name: Still Distance
    moving_energy:
      name: Moving Energy
    still_energy:
      name: Still Energy
    # Per-gate energies, for setting each gate's thresholds. They report
    # only while Engineering Mode is on.
    g0:
      move_energy:
        name: G0 Move Energy
      still_energy:
        name: G0 Still Energy
    g1:
      move_energy:
        name: G1 Move Energy
      still_energy:
        name: G1 Still Energy
    g2:
      move_energy:
        name: G2 Move Energy
      still_energy:
        name: G2 Still Energy
    g3:
      move_energy:
        name: G3 Move Energy
      still_energy:
        name: G3 Still Energy
    g4:
      move_energy:
        name: G4 Move Energy
      still_energy:
        name: G4 Still Energy
    g5:
      move_energy:
        name: G5 Move Energy
      still_energy:
        name: G5 Still Energy
    g6:
      move_energy:
        name: G6 Move Energy
      still_energy:
        name: G6 Still Energy
    g7:
      move_energy:
        name: G7 Move Energy
      still_energy:
        name: G7 Still Energy
    g8:
      move_energy:
        name: G8 Move Energy
      still_energy:
        name: G8 Still Energy

# Tunable at runtime from the web page or Home Assistant; no reflash.
number:
  - platform: ld2410
    timeout:
      name: Timeout
    max_move_distance_gate:
      name: Max Move Distance Gate
    max_still_distance_gate:
      name: Max Still Distance Gate
    g0:
      move_threshold:
        name: G0 Move Threshold
      still_threshold:
        name: G0 Still Threshold
    g1:
      move_threshold:
        name: G1 Move Threshold
      still_threshold:
        name: G1 Still Threshold
    g2:
      move_threshold:
        name: G2 Move Threshold
      still_threshold:
        name: G2 Still Threshold
    g3:
      move_threshold:
        name: G3 Move Threshold
      still_threshold:
        name: G3 Still Threshold
    g4:
      move_threshold:
        name: G4 Move Threshold
      still_threshold:
        name: G4 Still Threshold
    g5:
      move_threshold:
        name: G5 Move Threshold
      still_threshold:
        name: G5 Still Threshold
    g6:
      move_threshold:
        name: G6 Move Threshold
      still_threshold:
        name: G6 Still Threshold
    g7:
      move_threshold:
        name: G7 Move Threshold
      still_threshold:
        name: G7 Still Threshold
    g8:
      move_threshold:
        name: G8 Move Threshold
      still_threshold:
        name: G8 Still Threshold

# 0.2 m gates make "about 1 m" reachable: gate 5 ends at 1.2 m. Set Max Move
# and Max Still Distance Gate to 5 after first boot (see the bring-up doc).
select:
  - platform: ld2410
    distance_resolution:
      name: Distance Resolution

switch:
  - platform: ld2410
    engineering_mode:
      name: Engineering Mode

button:
  - platform: ld2410
    restart:
      name: Sensor Restart
    query_params:
      name: Query Params
