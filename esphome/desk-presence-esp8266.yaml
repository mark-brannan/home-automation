# Desk chair presence: ESP8266 (Wemos D1 mini) + HLK-LD2410C mmWave radar.
# Bring-up and tuning: docs/desk-presence-bringup.md
substitutions:
  name: desk-presence
  friendly_name: Desk Presence

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  api: !include common/api.yaml
  ota: !include common/ota.yaml
  logger: !include common/logger.yaml
  web: !include common/web.yaml
  radar: !include common/ld2410.yaml
  sitting: !include common/sitting.yaml

# The ESP8266 has one full hardware UART, and 256000 baud is too fast for
# software serial. The radar takes UART0 on its swapped pins, so the logger
# moves to UART1 (TX only, GPIO2 / D4); logs still stream over the API.
logger:
  hardware_uart: UART1

# Power save sleeps through multicast, so desk-presence.local never answers.
wifi:
  power_save_mode: none

# LD2410C TX -> GPIO13 (D7, UART0 RX swapped); LD2410C RX -> GPIO15 (D8,
# UART0 TX swapped). GPIO15 must be low at boot; the D1 mini pulls it down.
uart:
  id: uart_bus
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# Free heap, to judge whether the web page is worth its RAM on this chip.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: Free Heap

# Sitting timer and its two displays (TM1637 and SSD1306 OLED).
# Pins: workshop projects/desk-presence-sensor/README.md, Wiring table.
i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 14

display:
  - platform: tm1637
    clk_pin: GPIO14   # D5
    dio_pin: GPIO12   # D6
    intensity: 3
    update_interval: 1s
    lambda: |-
      it.printf("%02d.%02d", (id(sit_s) / 60) % 100, id(sit_s) % 60);
  # Three lines; rotating ones step every 4 s, as halmet's network row does.
  # 1 presence: AWAY counting up, or PRESENT / FAR with radar energies between.
  # 2 network: host, IP, MAC, SSID / RSSI; JOINING or AP FALLBACK off the LAN.
  # 3 uptime, then the last restart reason (skipped after a power-on).
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"   # an SH1106 needs model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto f = id(roboto);
      const uint32_t up = id(up_s);
      const uint32_t beat = up / 4;

      if (!id(presence).state) {
        const int a = id(away_s);
        if (a < 3600) it.printf(0, 0, f, "AWAY %02d:%02d", a / 60, a % 60);
        else it.printf(0, 0, f, "AWAY %d:%02d:%02d", a / 3600, a / 60 % 60, a % 60);
      } else if (beat % 2) {
        it.printf(0, 0, f, "move %.0f still %.0f", id(move_e).state, id(still_e).state);
      } else {
        const float cm = id(distance).state;
        it.printf(0, 0, f, "%s %.0f cm", cm <= id(desk_cm).state ? "PRESENT" : "FAR", cm);
      }

      if (WiFi.status() == WL_CONNECTED) {
        switch (beat % 4) {
          case 0: it.print(0, 22, f, App.get_name().c_str()); break;
          case 1: it.print(0, 22, f, WiFi.localIP().toString().c_str()); break;
          case 2: it.print(0, 22, f, WiFi.macAddress().c_str()); break;
          default: it.printf(0, 22, f, "%.9s / %ddB", WiFi.SSID().c_str(), (int) WiFi.RSSI());
        }
      } else if ((WiFi.getMode() & WIFI_AP) && beat % 2) {
        it.print(0, 22, f, "AP FALLBACK");
      } else {
        it.printf(0, 22, f, "JOINING %ds", id(join_s));
      }

      const char *why = nullptr;
      switch (ESP.getResetInfoPtr()->reason) {
        case REASON_DEFAULT_RST: break;
        case REASON_WDT_RST: why = "hw watchdog"; break;
        case REASON_EXCEPTION_RST: why = "crash"; break;
        case REASON_SOFT_WDT_RST: why = "sw watchdog"; break;
        case REASON_SOFT_RESTART: why = "restart"; break;
        case REASON_DEEP_SLEEP_AWAKE: why = "wake"; break;
        case REASON_EXT_SYS_RST: why = "ext pin"; break;
        default: why = "unknown";
      }
      if (why && beat % 2) it.printf(0, 44, f, "Restart: %s", why);
      else it.printf(0, 44, f, "Up %ud %02u:%02u:%02u", up / 86400, up / 3600 % 24, up / 60 % 60, up % 60);
