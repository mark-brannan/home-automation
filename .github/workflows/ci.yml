name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: yamllint --strict .
      - run: actionlint

  # No plaintext secrets.yaml tracked; every *.sops.* file is really encrypted.
  secrets-encrypted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/verify_encrypted.py
      - run: python3 scripts/verify_encrypted.py --self-test

  # `esphome config` over every device YAML. CI holds no decryption key, so
  # placeholder secrets stand in for the real ones (scripts/stub_esphome_secrets.py).
  esphome-config:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: devices
        run: |
          shopt -s nullglob
          files=(esphome/*.yaml)
          files=("${files[@]/esphome\/secrets.sops.yaml/}")
          n=0; for f in "${files[@]}"; do [ -n "$f" ] && n=$((n+1)); done
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || echo "No device YAML under esphome/; nothing to validate."
      - if: steps.devices.outputs.count != '0'
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - if: steps.devices.outputs.count != '0'
        run: pip install -r requirements-ci.txt
      - if: steps.devices.outputs.count != '0'
        run: |
          python3 scripts/stub_esphome_secrets.py
          for f in esphome/*.yaml; do
            [ "$f" = esphome/secrets.sops.yaml ] && continue
            echo "::group::esphome config $f"
            esphome config "$f" > /dev/null
            echo "::endgroup::"
          done

  # Refuses to call an empty PR green.
  nonempty:
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # The single required status check, reported as "ci-gate / gate".
  ci-gate:
    needs: [yamllint, secrets-encrypted, esphome-config, nonempty]
    if: always()
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
