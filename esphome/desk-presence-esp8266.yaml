# Desk chair presence: ESP8266 (Wemos D1 mini) + HLK-LD2410C mmWave radar.
# Bring-up and tuning: docs/desk-presence-bringup.md
substitutions:
  name: desk-presence
  friendly_name: Desk Presence

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  api: !include common/api.yaml
  ota: !include common/ota.yaml
  logger: !include common/logger.yaml
  web: !include common/web.yaml
  radar: !include common/ld2410.yaml
  sitting: !include common/sitting.yaml

# The ESP8266 has one full hardware UART, and 256000 baud is too fast for
# software serial. The radar takes UART0 on its swapped pins, so the logger
# moves to UART1 (TX only, GPIO2 / D4); logs still stream over the API.
logger:
  hardware_uart: UART1

# Power save sleeps through multicast, so desk-presence.local never answers.
wifi:
  power_save_mode: none

# LD2410C TX -> GPIO13 (D7, UART0 RX swapped); LD2410C RX -> GPIO15 (D8,
# UART0 TX swapped). GPIO15 must be low at boot; the D1 mini pulls it down.
uart:
  id: uart_bus
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# Free heap, to judge whether the web page is worth its RAM on this chip.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: Free Heap

# Sitting timer and its two displays (TM1637 and SSD1306 OLED).
# Pins: workshop projects/desk-presence-sensor/README.md, Wiring table.
i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1

# A step up from halmet's 5x7: letters 9 px tall, four rows 16 px apart.
font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 12

display:
  - platform: tm1637
    clk_pin: GPIO14   # D5
    dio_pin: GPIO12   # D6
    intensity: 3
    update_interval: 1s
    lambda: |-
      it.printf("%02d.%02d", (id(sit_s) / 60) % 100, id(sit_s) % 60);
  # 0 sitting timer; 1 distance to you (blank when away); 2 halmet's row 0
  # (symphony firmware/halmet main.cpp), only while joining and 5 min after;
  # 3 restart reason for 30 s after a reset, JOINING, UNABLE TO JOIN after
  # 2 min, else uptime.
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"   # an SH1106 needs model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto f = id(roboto);
      const uint32_t up = id(up_s);
      const float cm = id(distance).state;
      const bool far = id(presence).state && cm > id(desk_cm).state;

      // 0: how long sitting; FAR holds it, AWAY counts up
      if (id(presence).state) {
        it.printf(0, 0, f, "%s %d:%02d", far ? "FAR" : "SITTING", id(sit_s) / 60, id(sit_s) % 60);
      } else {
        const int a = id(away_s);
        it.printf(0, 0, f, "AWAY %d:%02d", a / 60, a % 60);
      }

      // 1: distance
      if (id(presence).state) it.printf(0, 16, f, "Distance %.0f cm", cm);

      // 2: halmet's row 0, only while joining and for 5 min after joining
      static uint32_t tick = 0;
      static uint32_t online_s = 0;   // seconds since Wi-Fi joined
      tick++;
      const bool online = WiFi.status() == WL_CONNECTED;
      online_s = online ? online_s + 1 : 0;
      if (!online || online_s < 300) {
        switch ((tick / 4) % 4) {
          case 0: it.printf(0, 32, f, "Host: %s", App.get_name().c_str()); break;
          case 1: it.printf(0, 32, f, "IP: %s", WiFi.localIP().toString().c_str()); break;
          case 2: it.print(0, 32, f, WiFi.macAddress().c_str()); break;
          default: {
            if (WiFi.status() != WL_CONNECTED) { it.print(0, 32, f, "not connected"); break; }
            String tail = " / " + String(WiFi.RSSI()) + "dB";
            String ssid = WiFi.SSID();
            ssid = ssid.substring(0, 21 - tail.length());  // 21 chars fit the 128 px row
            it.print(0, 32, f, (ssid + tail).c_str());
          }
        }
      }

      // 3: restart reason at boot, then Wi-Fi state or uptime
      const char *why = nullptr;
      switch (ESP.getResetInfoPtr()->reason) {
        case REASON_DEFAULT_RST: break;   // power on: nothing to say
        case REASON_WDT_RST: why = "hw watchdog"; break;
        case REASON_EXCEPTION_RST: why = "crash"; break;
        case REASON_SOFT_WDT_RST: why = "sw watchdog"; break;
        case REASON_SOFT_RESTART: why = "restart"; break;
        case REASON_DEEP_SLEEP_AWAKE: why = "wake"; break;
        case REASON_EXT_SYS_RST: why = "ext pin"; break;
        default: why = "unknown";
      }
      if (why && up < 30) it.printf(0, 48, f, "Restart: %s", why);
      else if (!online && id(join_s) >= 120) it.print(0, 48, f, "UNABLE TO JOIN");
      else if (!online) it.printf(0, 48, f, "JOINING %ds", id(join_s));
      else it.printf(0, 48, f, "Uptime: %ud %02u:%02u:%02u", up / 86400, up / 3600 % 24, up / 60 % 60, up % 60);
